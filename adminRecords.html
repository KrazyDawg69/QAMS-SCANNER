<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrar Dashboard - QAMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script type="module" src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(145deg, #e8f5e9, #c8e6c9, #a5d6a7);
      min-height: 100vh;
      padding: 20px;
    }

    .dashboard {
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    h2 {
      color: #2e7d32;
      font-weight: 700;
      margin-bottom: 20px;
      font-size: 1.8em;
      text-align: center;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
      background: white;
      padding: 15px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(76,175,80,0.1);
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-select {
      padding: 10px 16px;
      font-size: 0.95em;
      border: 2px solid #81c784;
      border-radius: 12px;
      outline: none;
      background-color: white;
      color: #2e7d32;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      min-width: 120px;
    }

    .filter-select:focus {
      border-color: #4caf50;
    }

    .export-btn {
      padding: 10px 20px;
      background-color: #66bb6a;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95em;
      cursor: pointer;
    }

    .export-btn:hover {
      background-color: #57a05b;
    }

    /* Stats Cards */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(76,175,80,0.1);
      text-align: center;
    }

    .stat-label {
      color: #2e7d32;
      font-size: 0.9em;
      text-transform: uppercase;
    }

    .stat-number {
      color: #1b5e20;
      font-size: 2em;
      font-weight: 700;
      line-height: 1.2;
    }

    .stat-sub {
      color: #4caf50;
      font-size: 0.8em;
    }

    /* Strand Filters */
    .strand-section {
      background: white;
      border-radius: 16px;
      padding: 15px 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(76,175,80,0.1);
    }

    .strand-title {
      color: #1b5e20;
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 1em;
    }

    .strand-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .strand-btn {
      padding: 6px 12px;
      background-color: #f1f8e9;
      border: 2px solid #81c784;
      border-radius: 20px;
      color: #2e7d32;
      font-weight: 500;
      font-size: 0.85em;
      cursor: pointer;
      white-space: nowrap;
    }

    .strand-btn.active {
      background-color: #4caf50;
      border-color: #2e7d32;
      color: white;
    }

    .strand-btn:hover {
      background-color: #66bb6a;
      color: white;
    }

    /* Strand Table */
    .strand-table {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(76,175,80,0.1);
    }

    .section-title {
      color: #1b5e20;
      font-weight: 600;
      margin-bottom: 15px;
      font-size: 1.1em;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th {
      text-align: left;
      padding: 12px 8px;
      color: #2e7d32;
      font-weight: 600;
      border-bottom: 2px solid #c8e6c9;
      font-size: 0.9em;
    }

    td {
      padding: 12px 8px;
      color: #33691e;
      border-bottom: 1px solid #e8f5e9;
      font-size: 0.9em;
    }

    .view-btn {
      padding: 4px 12px;
      background-color: #81c784;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 0.8em;
      cursor: pointer;
    }

    .view-btn:hover {
      background-color: #66bb6a;
    }

    /* Student List */
    .student-section {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(76,175,80,0.1);
    }

    .search-box {
      width: 100%;
      padding: 12px 18px;
      font-size: 0.95em;
      border: 2px solid #81c784;
      border-radius: 12px;
      outline: none;
      margin-bottom: 15px;
      background-color: white;
      color: #2e7d32;
    }

    .student-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .student-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #e8f5e9;
    }

    .student-info {
      flex: 1;
    }

    .student-name {
      font-weight: 600;
      color: #1b5e20;
      font-size: 0.95em;
    }

    .student-id {
      font-size: 0.8em;
      color: #4caf50;
    }

    .student-absences {
      background-color: #ffebee;
      color: #c62828;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.8em;
      white-space: nowrap;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 15px;
    }

    .page-btn {
      padding: 6px 16px;
      background-color: #f1f8e9;
      border: 2px solid #81c784;
      border-radius: 8px;
      color: #2e7d32;
      cursor: pointer;
      font-size: 0.9em;
    }

    .page-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .page-btn:hover:not(:disabled) {
      background-color: #66bb6a;
      color: white;
    }

    /* Graduated Section */
    .graduated-section {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(76,175,80,0.1);
    }

    .graduated-list {
      max-height: 200px;
      overflow-y: auto;
    }

    .graduate-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e8f5e9;
    }

    .delete-btn {
      padding: 4px 12px;
      background-color: #ef5350;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 0.8em;
    }

    .delete-btn:hover {
      background-color: #e53935;
    }

    .delete-all {
      margin-top: 15px;
      padding: 10px;
      background-color: #ef5350;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .logout-btn {
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #e53935;
      color: white;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1em;
      border: none;
      cursor: pointer;
      display: inline-block;
    }

    .logout-btn:hover {
      background-color: #c62828;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #4caf50;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      body { padding: 10px; }
      
      .stats-row {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .top-bar {
        flex-direction: column;
        align-items: stretch;
      }
      
      .filters {
        flex-direction: column;
      }
      
      .filter-select {
        width: 100%;
      }
      
      .strand-buttons {
        gap: 5px;
      }
      
      .strand-btn {
        font-size: 0.75em;
        padding: 4px 8px;
      }
    }

    @media (max-width: 480px) {
      .stats-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <h2>QAMS Registrar Dashboard</h2>

    <!-- Top Bar with Filters -->
    <div class="top-bar">
      <div class="filters">
        <select id="year-filter" class="filter-select"></select>
        <select id="month-filter" class="filter-select"></select>
        <select id="strand-filter" class="filter-select">
          <option value="ALL">All Strands</option>
          <option value="STEM-A">STEM-A</option>
          <option value="STEM-B">STEM-B</option>

          <option value="HUMSS-A">HUMSS-A</option>
          <option value="HUMSS-B">HUMSS-B</option>
          <option value="ABM">ABM</option>
          <option value="GAS">GAS</option>
          <option value="ComProg-A">ComProg-A</option>

      </div>

    <!-- Stats Cards -->
    <div class="stats-row">

    <!-- Strand Quick Filters -->

        <button class="strand-btn" data-strand="ComProg-B">ComProg-B</button>
        <button class="strand-btn" data-strand="Animation-A">Animation-A</button>
        <button class="strand-btn" data-strand="Animation-B">Animation-B</button>
        <button class="strand-btn" data-strand="FBS-A">FBS-A</button>

      </div>
    </div>

    <!-- Strand Summary Table (Grouped by Strand) -->
    <div class="strand-table">
      <div class="section-title">📊 Attendance Summary by Strand</div>
      <div class="table-container">
        <table id="strand-table">
          <thead>
            <tr>
              <th>Strand</th>
              <th>Sections</th>
              <th>Students</th>
              <th>Present</th>
              <th>Late</th>
              <th>Absent</th>
              <th>Rate</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="strand-tbody">
            <tr><td colspan="8" style="text-align: center;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Student List -->
    <div class="student-section">
      <div class="section-title">👥 Student List</div>
      <input type="text" id="student-search" class="search-box" placeholder="Search by name, ID, or section...">
      <div class="student-list" id="student-list"></div>
      <div class="pagination">
        <button class="page-btn" id="prev-page" disabled>← Previous</button>
        <span id="page-info">Page 1</span>

    <!-- Graduated Students -->
    <div class="graduated-section">
      <div class="section-title">🎓 Graduated Students</div>
      <div class="graduated-list" id="graduated-list"></div>

    <!-- Logout -->

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { 
  getFirestore, collection, getDocs, deleteDoc, doc, updateDoc 
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD9_SnkZwUKhTxWPw0xH5q6RjLSPTWjJDw",
  authDomain: "qams-2025.firebaseapp.com",
  projectId: "qams-2025",
  storageBucket: "qams-2025.firebasestorage.app",
  messagingSenderId: "827453407305",
  appId: "1:827453407305:web:c1eba2c58cb57b85d9ff98"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// State
let studentsData = [];
let scansData = [];
let currentStrand = "ALL";
let currentYear = new Date().getFullYear().toString();
let currentMonth = (new Date().getMonth() + 1).toString().padStart(2, '0');
let currentPage = 1;
const itemsPerPage = 15;

// DOM Elements
const yearFilter = document.getElementById("year-filter");
const monthFilter = document.getElementById("month-filter");
const strandFilter = document.getElementById("strand-filter");
const strandQuickFilters = document.getElementById("strand-quick-filters");
const totalStudentsEl = document.getElementById("total-students");
const presentCountEl = document.getElementById("present-count");
const lateCountEl = document.getElementById("late-count");
const absentCountEl = document.getElementById("absent-count");
const strandTbody = document.getElementById("strand-tbody");
const studentListEl = document.getElementById("student-list");
const graduatedListEl = document.getElementById("graduated-list");
const studentSearch = document.getElementById("student-search");
const prevPageBtn = document.getElementById("prev-page");
const nextPageBtn = document.getElementById("next-page");
const pageInfo = document.getElementById("page-info");
const exportBtn = document.getElementById("export-btn");
const deleteAllGraduated = document.getElementById("delete-all-graduated");

// Initialize year and month filters
function initDateFilters() {
  const currentYear = new Date().getFullYear();
  for (let y = currentYear - 1; y <= currentYear + 2; y++) {
    const option = document.createElement("option");
    option.value = y;
    option.textContent = y;
    if (y === currentYear) option.selected = true;
    yearFilter.appendChild(option);
  }
  
  const months = ["January", "February", "March", "April", "May", "June", 
                  "July", "August", "September", "October", "November", "December"];
  months.forEach((month, index) => {
    const option = document.createElement("option");
    option.value = (index + 1).toString().padStart(2, '0');
    option.textContent = month;
    if (index === new Date().getMonth()) option.selected = true;
    monthFilter.appendChild(option);
  });
}

// Load real data from Firebase
async function loadData() {
  try {
    console.log("Loading data...");
    
    // Load students
    const studentsRef = collection(db, "students");
    const studentsSnapshot = await getDocs(studentsRef);
    studentsData = [];
    
    studentsSnapshot.forEach(doc => {
      const data = doc.data() || {};
      // Safely extract data with defaults for everything
      studentsData.push({ 
        id: doc.id, 
        name: data.name || "Unknown",
        studentId: data.studentId || "",
        section: data.section || "",
        strand: data.strand || "Unknown",
        lrn: data.lrn || "",
        email: data.email || ""
      });
    });
    
    console.log(`Loaded ${studentsData.length} students`);
    
    // Load scans
    const scansRef = collection(db, "scans");
    const scansSnapshot = await getDocs(scansRef);
    scansData = [];
    
    scansSnapshot.forEach(doc => {
      const data = doc.data() || {};
      scansData.push({ 
        id: doc.id, 
        name: data.name || "Unknown",
        studentId: data.studentId || "",
        section: data.section || "",
        strand: data.strand || "Unknown",
        date: data.date || "",
        inTime: data.inTime || "",
        outTime: data.outTime || "",
        status: data.status || "Unknown"
      });
    });
    
    console.log(`Loaded ${scansData.length} scans`);
    
    updateDashboard();
  } catch (error) {
    console.error("Error loading data:", error);
    strandTbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #d32f2f;">Error loading data: ${error.message}</td></tr>`;
  }
}

// Filter by strand - with safety
function filterByStrand(data, strand) {
  if (!data || !Array.isArray(data)) return [];
  if (strand === "ALL") return data;
  
  return data.filter(s => {
    if (!s) return false;
    const studentStrand = s.strand || "Unknown";
    return studentStrand === strand;
  });
}

// Filter by year and month - with safety checks
function filterByDate(data) {
  if (!data || !Array.isArray(data)) return [];
  
  return data.filter(item => {
    if (!item || !item.date) return false;
    
    try {
      const dateStr = item.date.toString();
      const [month, day, year] = dateStr.split('/').map(Number);
      
      // Check if all parts are valid numbers
      if (isNaN(month) || isNaN(day) || isNaN(year)) return false;
      
      return year.toString() === currentYear && 
             month.toString().padStart(2, '0') === currentMonth;
    } catch (e) {
      console.warn("Error parsing date:", item.date, e);
      return false;
    }
  });
}

// Update dashboard
function updateDashboard() {
  // Filter by strand
  const filteredStudents = filterByStrand(studentsData, currentStrand);
  
  // Update total students
  totalStudentsEl.textContent = filteredStudents.length;
  
  // Filter scans by date
  const monthScans = filterByDate(scansData);
  
  // Calculate stats
  const present = monthScans.filter(s => s.status === "Present").length;
  const late = monthScans.filter(s => s.status === "Late").length;
  const absent = monthScans.filter(s => s.status === "Absent").length;
  
  presentCountEl.textContent = present;
  lateCountEl.textContent = late;
  absentCountEl.textContent = absent;
  
  // Update strand table
  updateStrandTable(filteredStudents, monthScans);
  
  // Update student list
  updateStudentList(filteredStudents, monthScans);
  
  // Update graduated list
  updateGraduatedList();
}

// Update strand table - GROUP BY STRAND
function updateStrandTable(students, scans) {
  // Ensure inputs are arrays
  students = students || [];
  scans = scans || [];
  
  const strands = {};
  
  // Initialize strand data
  students.forEach(s => {
    if (!s) return;
    const strand = s.strand || "Unknown";
    if (!strands[strand]) {
      strands[strand] = {
        total: 0,
        present: 0,
        late: 0,
        absent: 0,
        sections: new Set()
      };
    }
    strands[strand].total++;
    if (s.section) {
      strands[strand].sections.add(s.section);
    }
  });
  
  // ... rest of the function
  
  // Add scan data
  scans.forEach(s => {
    const strand = s.strand || "Unknown";
    if (strands[strand]) {
      if (s.status === "Present") strands[strand].present++;
      else if (s.status === "Late") strands[strand].late++;
      else if (s.status === "Absent") strands[strand].absent++;
    }
  });
  
    // Convert to array for display
  const strandsArray = Object.entries(strands)
    .filter(([strand]) => currentStrand === "ALL" || strand === currentStrand)
    .map(([name, data]) => ({ 
      name, 
      ...data,
      sections: Array.from(data.sections).join(", ") 
    }))
    .sort((a, b) => a.name.localeCompare(b.name));
  
  if (strandsArray.length === 0) {
    strandTbody.innerHTML = `<tr><td colspan="8" style="text-align: center;">No strands found</td></tr>`;
    return;
  }
  
  strandTbody.innerHTML = strandsArray.map(s => {
    const attended = s.present + s.late;
    const rate = s.total ? Math.round((attended / s.total) * 100) : 0;
    return `
      <tr>
        <td><strong>${s.name}</strong></td>
        <td>${s.sections || "—"}</td>
        <td>${s.total}</td>
        <td>${s.present}</td>
        <td>${s.late}</td>
        <td>${s.absent}</td>
        <td>${rate}%</td>
        <td><button class="view-btn" data-strand="${s.name}">View</button></td>
      </tr>
    `;
  }).join('');
  
  // Add view button listeners
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentStrand = btn.dataset.strand;
      strandFilter.value = currentStrand;
      currentPage = 1;
      updateDashboard();
      
      // Update active strand button
      document.querySelectorAll('.strand-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.strand === currentStrand);
      });
    });
  });
}

// Update student list
function updateStudentList(students, scans) {
  const searchTerm = studentSearch.value.toLowerCase();
  
  // Count attendance per student
  const absenceCount = {};
  const lateCount = {};
  const presentCount = {};
  
  scans.forEach(s => {
    const name = s.name;
    if (s.status === "Absent") absenceCount[name] = (absenceCount[name] || 0) + 1;
    if (s.status === "Late") lateCount[name] = (lateCount[name] || 0) + 1;
    if (s.status === "Present") presentCount[name] = (presentCount[name] || 0) + 1;
  });
  
  // Filter and search
  let filtered = students.filter(s => {
    const matchesStrand = currentStrand === "ALL" || s.strand === currentStrand;
    const matchesSearch = !searchTerm || 
      (s.name && s.name.toLowerCase().includes(searchTerm)) || 
      (s.studentId && s.studentId.toLowerCase().includes(searchTerm)) ||
      (s.section && s.section.toLowerCase().includes(searchTerm));
    return matchesStrand && matchesSearch;
  });
  
  // Pagination
  const totalPages = Math.ceil(filtered.length / itemsPerPage);
  const start = (currentPage - 1) * itemsPerPage;
  const end = start + itemsPerPage;
  const paginated = filtered.slice(start, end);
  
  // Render
  if (paginated.length === 0) {
    studentListEl.innerHTML = '<div style="text-align: center; padding: 20px;">No students found</div>';
  } else {
    studentListEl.innerHTML = paginated.map(s => `
      <div class="student-row">
        <div class="student-info">
          <div class="student-name">${s.name || "Unknown"}</div>
          <div class="student-id">${s.studentId || "—"} | ${s.section || "No Section"} | ${s.strand || "No Strand"}</div>
        </div>
        <div class="student-absences" title="Present: ${presentCount[s.name] || 0}, Late: ${lateCount[s.name] || 0}, Absent: ${absenceCount[s.name] || 0}">
          A: ${absenceCount[s.name] || 0}
        </div>
      </div>
    `).join('');
  }
  
  // Update pagination
  pageInfo.textContent = `Page ${currentPage} of ${totalPages || 1}`;
  prevPageBtn.disabled = currentPage === 1;
  nextPageBtn.disabled = currentPage === totalPages || totalPages === 0;
}

// Update graduated list
async function updateGraduatedList() {
  try {
    const graduatesRef = collection(db, "graduates");
    const snapshot = await getDocs(graduatesRef);
    
    if (snapshot.empty) {
      graduatedListEl.innerHTML = '<div style="text-align: center; padding: 10px;">No graduated students</div>';
      deleteAllGraduated.style.display = "none";
      return;
    }
    
    deleteAllGraduated.style.display = "block";
    const graduates = [];
    snapshot.forEach(doc => {
      graduates.push({ id: doc.id, ...doc.data() });
    });
    
    graduatedListEl.innerHTML = graduates.map(g => `
      <div class="graduate-row">
        <div>
          <div class="student-name">${g.name || "Unknown"}</div>
          <div class="student-id">Batch: ${g.batch || "—"} | ${g.section || "—"}</div>
        </div>
        <button class="delete-btn" data-id="${g.id}">Delete</button>
      </div>
    `).join('');
    
    // Add delete listeners
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (confirm('Delete this graduate?')) {
          await deleteDoc(doc(db, "graduates", btn.dataset.id));
          updateGraduatedList();
        }
      });
    });
    
    deleteAllGraduated.onclick = async () => {
      if (confirm('Delete ALL graduated students permanently?')) {
        for (const g of graduates) {
          await deleteDoc(doc(db, "graduates", g.id));
        }
        updateGraduatedList();
      }
    };
    
  } catch (error) {
    graduatedListEl.innerHTML = '<div style="text-align: center; padding: 10px;">No graduates collection</div>';
    deleteAllGraduated.style.display = "none";
  }
}

// Event Listeners
yearFilter.addEventListener('change', (e) => {
  currentYear = e.target.value;
  currentPage = 1;
  updateDashboard();
});

monthFilter.addEventListener('change', (e) => {
  currentMonth = e.target.value;
  currentPage = 1;
  updateDashboard();
});

strandFilter.addEventListener('change', (e) => {
  currentStrand = e.target.value;
  currentPage = 1;
  updateDashboard();
  
  document.querySelectorAll('.strand-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.strand === currentStrand);
  });
});

strandQuickFilters.addEventListener('click', (e) => {
  if (e.target.classList.contains('strand-btn')) {
    const strand = e.target.dataset.strand;
    currentStrand = strand;
    strandFilter.value = strand;
    currentPage = 1;
    updateDashboard();
    
    document.querySelectorAll('.strand-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.strand === strand);
    });
  }
});

studentSearch.addEventListener('input', () => {
  currentPage = 1;
  updateDashboard();
});

prevPageBtn.addEventListener('click', () => {
  if (currentPage > 1) {
    currentPage--;
    updateDashboard();
  }
});

nextPageBtn.addEventListener('click', () => {
  currentPage++;
  updateDashboard();
});

exportBtn.addEventListener('click', () => {
  const data = filterByDate(scansData);
  const csv = [
    ["Name", "Student ID", "Section", "Strand", "Date", "In Time", "Out Time", "Status"],
    ...data.map(s => [
      s.name || "",
      s.studentId || "",
      s.section || "",
      s.strand || "",
      s.date || "",
      s.inTime || "",
      s.outTime || "",
      s.status || ""
    ])
  ].map(row => row.join(",")).join("\n");
  
  const blob = new Blob([csv], { type: "text/csv" });
  saveAs(blob, `attendance_${currentYear}-${currentMonth}.csv`);
});

// Logout
window.logout = function() {
  const authItems = ['role', 'username', 'studentId', 'studentName', 'userName'];
  authItems.forEach(item => localStorage.removeItem(item));
  window.location.href = "index.html";
};

initDateFilters();
loadData();
